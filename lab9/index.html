<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Registration Validation</title>
    <style type="text/css">
	body {
	  font-family: Arial, sans-serif;
	  background: #e3f2fd;
	  padding: 30px;
	  text-align: center;
	  min-height: 100vh;
	  box-sizing: border-box;
	}

	h2 {
	  color: #1976d2;
	  font-size: 3rem; /* Increased font size */
	}

	form {
	  background: #fff;
	  padding: 60px 70px; /* Increased padding */
	  display: inline-block;
	  border-radius: 12px;
	  box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
	  transform: scale(1.3); /* Scales up the entire form by 30% */
	  margin-top: 50px;
	}

	input[type="text"],
	input[type="password"] {
	  padding: 16px; /* Increased padding */
	  border-radius: 6px;
	  font-size: 1.2rem; /* Increased font size */
	  width: 100%;
	  box-sizing: border-box;
	  margin: 12px 0;
	  border: 1px solid #ccc;
	}

	input[type="button"] {
	  background: #1976d2;
	  color: #fff;
	  padding: 15px 30px; /* Increased padding */
	  border: none;
	  border-radius: 6px;
	  cursor: pointer;
	  margin-top: 15px;
	  font-size: 1.1rem; /* Increased font size */
	}

    </style>
    <script type="text/javascript">
	function validate() {
	  var uid = document.getElementById("uid").value.trim();
	  var name = document.getElementById("name").value.trim();
	  var pass = document.getElementById("pass").value;
	  var email = document.getElementById("email").value.trim();

	  // 1. User ID Validation (5-12 chars)
	  if (uid.length < 5 || uid.length > 12) {
	    alert("User ID must be 5-12 characters.");
	    return false;
	  }

	  // 2. Name Validation (Letters and spaces, min 8 chars)
	  if (!/^[A-Za-z ]{8,}$/.test(name)) {
	    alert("Name must be alphabets and spaces only, at least 8 characters.");
	    return false;
	  }

	  // 3. Password Validation (Min 8 chars, 1 uppercase, 1 special char)
	  var passRegex = /^(?=.*[A-Z])(?=.*[!@#$%^&*]).{8,}$/;
	  if (!passRegex.test(pass)) {
	    alert("Password must be at least 8 characters, including 1 uppercase letter and 1 special character.");
	    return false;
	  }

	  // 4. Email Validation
	  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
	    alert("Invalid Email.");
	    return false;
	  }

	  alert("Registration Successful!");
	  return true; // Explicitly return true to allow form submission
	}

    </script>
  </head>
  <body>
    <h2>User Registration</h2>
    <form action="#">
      <input type="text" id="uid" placeholder="User ID" /><br />
      <input type="text" id="name" placeholder="Full Name" /><br />
      <input type="password" id="pass" placeholder="Password" /><br />
      <input type="text" id="email" placeholder="Email" /><br />
      <input type="button" value="Register" onclick="validate()" />
    </form>
  </body>
</html>
